<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b2438" />
  <meta name="description" content="Grace English Training — 12-week B1→B2 automation program" />
  <title>Grace English Training</title>
</head>
<body>
  <div id="app"></div>
  <script>
  (async () => {
    try {
      const cssParts = await Promise.all(['00','01'].map(n => fetch(`/chunks/css/${n}.txt`).then(r => { if(!r.ok) throw new Error(`CSS ${n}`); return r.text(); })));
      const style = document.createElement('style');
      style.textContent = cssParts.join('');
      document.head.appendChild(style);
      const appParts = await Promise.all(['00','01','02','03','04','05'].map(n => fetch(`/chunks/app/${n}.txt`).then(r => { if(!r.ok) throw new Error(`APP ${n}`); return r.text(); })));
      (0, eval)(appParts.join(''));
    } catch (err) {
      console.error(err);
      document.getElementById('app').innerHTML = '<main style="max-width:720px;margin:60px auto;padding:24px;font-family:system-ui"><h1>Grace English Training</h1><p>앱 파일을 불러오지 못했습니다. 새로고침해 주세요.</p><pre style="white-space:pre-wrap">'+String(err)+'</pre></main>';
    }
  })();
  </script>
</body>
</html>
